      type: object
      required: [page, pageSize, total, hasNext]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
      examples:
        - page: 1
          pageSize: 10
          total: 0
          hasNext: false

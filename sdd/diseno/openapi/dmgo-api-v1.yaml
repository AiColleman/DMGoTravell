  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        traceId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/ClosureBlocker'
      additionalProperties: true
      examples:
        - type: https://dmgo.travel/problems/invalid-page
          title: Solicitud inválida
          status: 400
          detail: Número de página no válido
          code: invalid_page
          traceId: "00000000000000000000000000000000"
        - type: https://dmgo.travel/problems/account-closure-blocked
          title: No se puede completar la baja
          status: 409
          detail: Existen operaciones activas que impiden la baja.
          code: account_closure_blocked
          blockers:
            - type: reservation
              reference: R-00000000
              status: confirmed
          traceId: "00000000000000000000000000000000"
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
    ProblemCode:
      type: string
      enum:
        - validation_failed
        - invalid_page
        - invalid_range
        - invalid_filter
        - invalid_token
        - unauthenticated
        - invalid_credentials
        - forbidden
        - email_not_verified
        - not_found
        - reservation_unavailable
        - payment_not_payable
        - transition_not_allowed
        - stale_version
        - duplicate_name
        - incomplete_publication
        - inventory_below_commitments
        - account_closure_blocked
        - email_already_registered
        - already_verified
        - request_superseded
        - idempotency_conflict
        - already_manually_resent
        - refund_not_authorizable
        - export_not_ready
        - report_not_ready
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - export_expired
        - report_expired
        - media_not_published
        - capture_capacity_exceeded
        - provider_unavailable
        - internal_error

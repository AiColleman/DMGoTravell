components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT en memoria; no se usa refresh en localStorage.
    refreshCookie:
      type: apiKey
      in: cookie
      name: dmgo_refresh
      description: Cookie refresh HttpOnly/Secure/host-only; nombre exacto y atributos pendientes de API-02.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token CSRF para operaciones con cookie; mecanismo pendiente de API-02.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: Versión/ETag esperada; obligatoria cuando el contrato exige control de concurrencia.
    TypePath:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum: [tours, packages]

services:
  postgres:
    image: postgres:16-alpine
    container_name: dmgotravel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dmgotravel_dev
      POSTGRES_USER: dmgotravel_user
      POSTGRES_PASSWORD: dmgotravel_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmgotravel_user -d dmgotravel_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
